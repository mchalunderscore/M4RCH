monitor.alsa.rules = [
  { matches = [ { api.alsa.path = "hw:AppleJ614HPAI,0" } ]
    actions = { update-props = {
      node.name = "alsa_input.apple.j614.RawMics"
      node.description = "Built-in three-channel microphone array"
      node.hidden = true
      priority.session = 100
    } }
  }
]

# WirePlumber owns the filter, so it can access the hidden hardware source and
# recreate the processed source whenever the hardware node is recreated.
wireplumber.profiles = { main = { node.software-dsp = required } }
node.software-dsp.rules = [
  { matches = [ { node.name = "alsa_input.apple.j614.RawMics" } ]
    actions = { create-filter = {
      filter-path = "/usr/share/asahi-scripts/microphone-graph.conf"
      hide-parent = true
    } }
  }
]
