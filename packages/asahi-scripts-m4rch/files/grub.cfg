# Discover device drivers normally; keep the unqualified speaker amplifiers disabled.
GRUB_CMDLINE_LINUX_DEFAULT="idle=wfi arm64.nowfxt pd_ignore_unused clk_ignore_unused log_buf_len=8M mem_sleep_default=s2idle modprobe.blacklist=snd_soc_tas2764,snd_soc_tas2770 user4k=on appledrm.t6041_dcpext=1 quiet splash"
GRUB_DEFAULT=0
GRUB_TIMEOUT=5
GRUB_TOP_LEVEL=/boot/vmlinuz-linux-m4rch
GRUB_TERMINAL_OUTPUT=console
GRUB_DISABLE_SUBMENU=true
GRUB_DISABLE_RECOVERY=true
