# Keep driver initialization in userspace, in DCP-before-GPU order.
GRUB_CMDLINE_LINUX_DEFAULT="idle=wfi arm64.nowfxt pd_ignore_unused clk_ignore_unused log_buf_len=8M mem_sleep_default=s2idle m4rch.dcp=1 modprobe.blacklist=asahi,appledrm,aop,apple_isp,snd_soc_tas2764,snd_soc_tas2770"
GRUB_DEFAULT=0
GRUB_TERMINAL_OUTPUT=console
