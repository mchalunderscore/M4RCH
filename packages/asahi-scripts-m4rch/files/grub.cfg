# Discover device drivers normally; keep the unqualified speaker amplifiers disabled.
GRUB_CMDLINE_LINUX_DEFAULT="idle=wfi arm64.nowfxt pd_ignore_unused clk_ignore_unused log_buf_len=8M mem_sleep_default=s2idle m4rch.dcp=1 modprobe.blacklist=snd_soc_tas2764,snd_soc_tas2770 user4k=on appledrm.j614s_vrr=1 m4rch.extdisp=1 appledrm.t6041_dcpext=1 quiet splash"
GRUB_DEFAULT=0
GRUB_TOP_LEVEL=/boot/vmlinuz-linux-m4rch
GRUB_TERMINAL_OUTPUT=console
