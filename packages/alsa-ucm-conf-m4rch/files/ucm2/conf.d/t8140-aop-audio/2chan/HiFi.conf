# For laptops with a two-channel mic array on PCM 1 of the T8140 AOP card (J700)
#
# PCM 0 of this card is the always-on low-power microphone. It is not a UCM
# device on purpose: the array is the only microphone users see.

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		TQ Voice
		CaptureChannels "2"
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		# Unplugged while the lid is closed: the lid disconnects the
		# microphones in hardware.
		JackControl "Internal Mic Jack"
	}
}
