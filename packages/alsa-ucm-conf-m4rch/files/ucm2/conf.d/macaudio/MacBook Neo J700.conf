Syntax 6

# The CS42L83 jack mixer defaults to mute (0 = -63 dB); start it at -50 dB
# relative to jack full scale, with the headset ADC at 0 dB and its HPF on.
BootSequence [
	cset "name='Jack Mixer Volume' 13,13"
	cset "name='Jack ADC Volume' 97"
	cset "name='Jack ADC HPF Switch' on"
]

SectionUseCase."HiFi" {
	Comment "Default"
	Define.JackCodec "cs42l83"
	Define.PlaybackChannels "2"
	Define.JackDevice "0"
	Define.SpeakerDevice "1"
	Define.SpeakerElem "Speaker Playback Volume"
	File "/conf.d/macaudio/laptops/HiFi.conf"
}
