# For laptops with 6 speakers (4 woofers and 2 tweeters) whose speaker card
# has no headphone codec (J616s: the jack is a card of its own)

SectionVerb {
	EnableSequence [
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	Value {
		PlaybackChannels "6"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}
