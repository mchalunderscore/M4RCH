# Only the linux-m4rch preset uses this configuration. Selecting a config with
# mkinitcpio -c disables automatic config.d loading, so explicitly retain
# Aurora's first-boot and audio drop-ins. The rebuilt M4RCH kernel must have
# CONFIG_SND_SEQUENCER=m; the previous retained binary did not.
. /etc/mkinitcpio.conf
. /etc/mkinitcpio.conf.d/90-aurora.conf
. /etc/mkinitcpio.conf.d/90-aurora-audio.conf
# The installer builds this image on a guest, not on the target Mac. Host
# autodetection would filter out J614s drivers needed at first boot.
m4rch_hooks=()
for m4rch_hook in "${HOOKS[@]}"; do
  [[ $m4rch_hook == autodetect ]] || m4rch_hooks+=("$m4rch_hook")
done
HOOKS=("${m4rch_hooks[@]}")
unset m4rch_hook m4rch_hooks
MODULES+=(btrfs nvme-apple apple-sart dm-crypt dm-integrity xts)
FILES+=(/usr/lib/modprobe.d/m4rch-j614s.conf)
# This machine's proprietary radio firmware is provisioned locally, never in
# the repository. Include it when present so the driver can load it in initrd.
for m4rch_firmware in /usr/lib/firmware/brcm/brcmfmac4388c2-pcie.apple,mriya*; do
  [[ -f $m4rch_firmware ]] && FILES+=("$m4rch_firmware")
done
unset m4rch_firmware
